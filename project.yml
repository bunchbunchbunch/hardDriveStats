name: DriveStats
options:
  bundleIdPrefix: com.bunchbunchbunch
  deploymentTarget:
    macOS: "15.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    # Ad hoc, so anyone can build it. build.sh signs with your own team when DRIVESTATS_TEAM is set.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
targets:
  DriveStats:
    type: application
    platform: macOS
    sources: [Sources]
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleName: Drive Stats
        CFBundleDisplayName: Drive Stats
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.utilities
        NSAppleEventsUsageDescription: Drive Stats asks Finder to empty the Trash.
    settings:
      base:
        PRODUCT_NAME: Drive Stats
        PRODUCT_MODULE_NAME: DriveStats
        PRODUCT_BUNDLE_IDENTIFIER: com.bunchbunchbunch.drivestats
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  DriveStatsTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Sources/Core, Tests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
schemes:
  DriveStats:
    build:
      targets:
        DriveStats: all
        DriveStatsTests: [test]
    test:
      targets: [DriveStatsTests]
